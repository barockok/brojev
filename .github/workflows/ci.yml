name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - run: go test -race ./...
      # The runner images ship Google Chrome stable, the browser users run.
      # (Chrome for Testing 155 on macOS could not load any network URL.)
      - name: Chrome version
        run: |
          if [ "$RUNNER_OS" = macOS ]; then "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" --version; else google-chrome --version; fi
      - name: allow Chrome's sandbox (Ubuntu 24.04 restricts user namespaces)
        if: runner.os == 'Linux'
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: e2e (real Chrome, headless)
        env:
          BROJEV_E2E: "1"
        run: go test -count=1 ./internal/page/ ./internal/mcpserver/
      - run: sh -n bin/brojev-mcp

  cross-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: |
          for t in darwin/amd64 darwin/arm64 linux/amd64 linux/arm64; do
            GOOS=${t%/*} GOARCH=${t#*/} CGO_ENABLED=0 go build -o /dev/null ./cmd/brojev
          done
